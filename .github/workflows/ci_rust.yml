name: "CI/Rust"
on:
  workflow_call:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        rust_toolchain: ["nightly","stable"]
        cargo_test_args: [""]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: boinkor-net/ci-baseline-rust/actions/test@main
        with:
          rust_toolchain: ${{matrix.rust_toolchain}}
          cargo_test_args: ${{matrix.cargo_test_args}}
          manifest_dir: .

  rust_fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: boinkor-net/ci-baseline-rust/actions/fmt@main
        with:
          rust_toolchain: stable
          manifest_dir: .

  udev_feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install libudev
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --features udev

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: boinkor-net/ci-baseline-rust/actions/clippy@main
        with:
          manifest_dir: .

  cargo_deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: boinkor-net/ci-baseline-rust/actions/cargo_deny@main
        with:
          manifest_dir: .
