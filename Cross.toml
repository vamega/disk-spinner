[build.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS=1"]

[target.x86_64-unknown-linux-gnu]
pre-build = [
  "apt-get update && apt-get --assume-yes install libudev-dev pkg-config",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update && apt-get --assume-yes install libudev-dev:$CROSS_DEB_ARCH pkg-config",
]

[target.i686-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update && apt-get --assume-yes install libudev-dev:$CROSS_DEB_ARCH pkg-config",
]
